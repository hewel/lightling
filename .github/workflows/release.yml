name: Release
permissions:
  contents: write

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:

# TODO: add job to upload new versions to stores with API
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CHROMIUM_CRX_PEM: ${{ secrets.CHROMIUM_CRX_PEM }}


    steps:
      - uses: actions/checkout@v2
      - uses: ./.github/actions/prepare-build

      - name: Set variables
        run: echo "PROJECT_VERSION=$(jq -r .version package.json)" >> $GITHUB_ENV

      - name: Package all targets
        run: npm run package

      - name: Build CRX file for chromium
        if: ${{ !contains(env.PROJECT_VERSION, '-') && env.CHROMIUM_CRX_PEM != '' }}
        working-directory: "./build"
        run: |
          echo "$CHROMIUM_CRX_PEM" > ./crx.pem
          npx crx pack chromium -o lightling.crx -p ./crx.pem
          ls -al ./

      - name: Archive source for Firefox review
        if: ${{ !contains(env.PROJECT_VERSION, '-') }}
        run: git archive --format=zip --output=build/lightling-source.zip HEAD

      - name: Submit listed Firefox build to AMO
        if: ${{ !contains(env.PROJECT_VERSION, '-') }}
        working-directory: "./build"
        env:
          AMO_KEY: ${{ secrets.AMO_KEY }}
          AMO_SECRET: ${{ secrets.AMO_SECRET }}
        run: |
          mkdir ./AMO
          npx web-ext sign --channel listed --approval-timeout 0 --no-input --api-key "$AMO_KEY" --api-secret "$AMO_SECRET" --source-dir ./firefox-standalone --artifacts-dir ./AMO --upload-source-code ./lightling-source.zip

      - name: Archive build files
        uses: actions/upload-artifact@v4
        id: upload-build-artifacts
        if: always()
        with:
          name: build-files
          path: build

        # Read docs on https://github.com/softprops/action-gh-release
      - name: Publish release on GitHub
        uses: softprops/action-gh-release@v1
        with:
          # Use tag name from `package.json`
          # WARNING: source code in release will be bound to this tag,
          # so if any changes in code been inserted, we must create another version and tag
          tag_name: v${{ env.PROJECT_VERSION }}
          name: v${{ env.PROJECT_VERSION }}
          prerelease: ${{ contains(env.PROJECT_VERSION, '-') }}
          generate_release_notes: true
          # Use current commit hash, instead of main branch
          target_commitish: ${{ github.sha }}
          files: |
            build/*.crx
            build/*.zip

      - name: Build static files for GitHub Pages
        if: ${{ !contains(env.PROJECT_VERSION, '-') && env.CHROMIUM_CRX_PEM != '' }}
        working-directory: "./build"
        run: |
          mkdir ./site
          node ../scripts/genCrxUpdateManifest.js > ./site/chromium_updates.xml
          # TODO: build index.html with landing page
